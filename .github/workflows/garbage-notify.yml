name: Garbage Notification Bot

on:
  schedule:
    # 毎日 21:00 (JST) に実行
    - cron: '0 12 * * *'
  
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 依存ライブラリのインストール
        run: pip install requests

      - name: 通知スクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # ★ ここを修正！ `.github/workflows/` を消してルート階層のファイルを指定する
        run: python notify.py
